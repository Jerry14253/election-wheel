<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Spin a wheel of every U.S. presidential election year from 1788 to 2024.">
<title>Election Year Wheel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap">
<style>
/* Layout: a single navy screen, the wheel centered and sized to the viewport; click the wheel to spin */
:root {
  --bg: #0c1838;
  --slice-a: #b8243a;
  --slice-b: #24479c;
  --rim: #ffffff;
  --pointer: #f2b705;
  --display: "Oswald", "Arial Narrow", system-ui, sans-serif;
  --year: #ffffff;
  --hit: #ffffff;
  --mono: "Oswald", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--year); font-family: var(--mono); overflow: hidden;
}
.screen { height: 100%; display: grid; grid-template-rows: auto 1fr; justify-items: center; align-items: center; gap: 2vh; padding-inline: 16px; padding-block: 3vh; box-sizing: border-box; }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(24px, 4.5vh, 48px); letter-spacing: .03em; text-transform: uppercase; color: var(--year); text-align: center; }
.wheel-box { position: relative; width: min(80vh, 88vw, 880px); border-radius: 50%; aspect-ratio: 1; max-width: 100%; }
canvas { width: 100%; height: 100%; display: block; cursor: pointer; border-radius: 50%; }
canvas:focus-visible { outline: 2px solid var(--hit); outline-offset: 6px; }
.pointer {
  position: absolute; left: 50%; top: -10px; transform: translateX(-50%);
  width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
  border-top: 30px solid var(--pointer); pointer-events: none;
  transform-origin: 50% 0; transition: transform .08s ease-out; z-index: 2;
}
.pointer.tick { transform: translateX(-50%) rotate(-18deg); transition: none; }
.hub {
  position: absolute; inset: 0; margin: auto; width: 20%; height: 20%; border-radius: 50%;
  background: var(--bg); border: 3px solid var(--rim); display: grid; place-items: center;
  pointer-events: none;
}
.haze {
  position: fixed; inset: 0; display: grid; place-items: center; cursor: pointer; z-index: 10;
  background: rgba(8, 16, 40, .84); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  opacity: 0; pointer-events: none; transition: opacity .5s ease;
}
.haze.show { opacity: 1; pointer-events: auto; }
.haze span {
  font-family: var(--display); font-weight: 700;
  font-size: clamp(110px, 28vmin, 340px); line-height: 1; letter-spacing: .02em; color: #ffffff;
  font-variant-numeric: tabular-nums; 
  transform: scale(.85); transition: transform .6s cubic-bezier(.2,.8,.2,1);
}
.haze.show span { transform: scale(1); }
@media (prefers-reduced-motion: reduce) { .haze, .haze span { transition: none; } }
.mute {
  position: fixed; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--rim); background: var(--slice-b);
  color: var(--year); display: grid; place-items: center; cursor: pointer; padding: 0;
}
.mute:hover { background: var(--slice-a); }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
.mute:focus-visible { outline: 2px solid var(--hit); outline-offset: 3px; }
.mute svg { width: 20px; height: 20px; }
.mute .off { display: none; }
.mute[aria-pressed="true"] .on { display: none; }
.mute[aria-pressed="true"] .off { display: inline; }
</style>
<style>html, body { margin: 0; }</style>
</head>
<body>

<div class="screen">
  <h1>Election Year Wheel</h1>
  <div class="wheel-box">
    <canvas id="wheel" tabindex="0" role="button" aria-label="Spin the wheel"></canvas>
    <div class="pointer" id="pointer" aria-hidden="true"></div>
    <div class="hub" aria-hidden="true"></div>
  </div>
</div>
<div class="haze" id="haze" aria-live="assertive"><span id="big"></span></div>
<canvas class="confetti" id="confetti" aria-hidden="true"></canvas>
<button class="mute" id="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/>
    <path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
    <path class="off" d="M17 9l5 6M22 9l-5 6"/>
  </svg>
</button>

<script>
const YEARS = Array.from({ length: 60 }, (_, i) => 1788 + i * 4);
const N = YEARS.length, SLICE = (Math.PI * 2) / N;
const canvas = document.getElementById('wheel'), ctx = canvas.getContext('2d');
const pointer = document.getElementById('pointer');
const muteBtn = document.getElementById('mute');

// Sound: synthesized with Web Audio, started from the viewer's click
let actx = null, muted = false;
try { muted = localStorage.getItem('wheel-muted') === '1'; } catch (e) {}
muteBtn.setAttribute('aria-pressed', muted);
muteBtn.addEventListener('click', e => {
  e.stopPropagation();
  muted = !muted;
  muteBtn.setAttribute('aria-pressed', muted);
  muteBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  try { localStorage.setItem('wheel-muted', muted ? '1' : '0'); } catch (e) {}
});
function audio() {
  if (muted) return null;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  } catch (e) { return null; }
}
function tone(freq, start, len, vol, type) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + start;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + len + 0.02);
}
// Shared white-noise buffer for clicks and whoosh
let noiseBuf = null;
function noise(a) {
  if (!noiseBuf) {
    noiseBuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const s = a.createBufferSource();
  s.buffer = noiseBuf;
  return s;
}
// Filtered noise burst: type/freq/q shape the filter, vol/len the envelope
function burst(a, t, len, vol, type, freq, q) {
  const s = noise(a), f = a.createBiquadFilter(), g = a.createGain();
  f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t, Math.random() * 1.5); s.stop(t + len + 0.02);
  return f;
}
// Plastic peg clicker: a sharp snap plus a short woody knock
function tickSound() {
  const a = audio(); if (!a) return;
  const t = a.currentTime, v = 0.85 + Math.random() * 0.3;
  burst(a, t, 0.025, 0.5 * v, 'bandpass', 3200 + Math.random() * 600, 2.5);
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle';
  o.frequency.setValueAtTime(1100, t);
  o.frequency.exponentialRampToValueAtTime(380, t + 0.03);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.22 * v, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + 0.06);
}
// Whoosh as the wheel is thrown
function startSound() {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  const s = noise(a), f = a.createBiquadFilter(), g = a.createGain();
  f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(400, t);
  f.frequency.exponentialRampToValueAtTime(2400, t + 0.25);
  f.frequency.exponentialRampToValueAtTime(600, t + 0.6);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.35, t + 0.12);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
  s.connect(f).connect(g).connect(a.destination);
  s.start(t); s.stop(t + 0.65);
}
// Bright bell "ding": a pure tone plus the softer overtones a struck chime has
function bell(a, freq, t, len, vol) {
  [[1, 1], [2.76, 0.35], [5.4, 0.12]].forEach(([mult, amt]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(freq * mult, t);
    const l = len / mult ** 0.5;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol * amt, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + l);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + l + 0.05);
  });
}
// Winner chime: a quick rising sparkle that rings out on the top note
function revealSound() {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  [783.99, 987.77, 1174.66].forEach((f, i) => bell(a, f, t + i * 0.07, 0.5, 0.12));
  bell(a, 1567.98, t + 0.21, 1.6, 0.16);
  bell(a, 783.99, t + 0.21, 1.6, 0.07);
}
const haze = document.getElementById('haze'), big = document.getElementById('big');
const css = getComputedStyle(document.documentElement);
const C = k => css.getPropertyValue(k).trim();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rotation = 0, spinning = false, size = 0, landed = -1, lastIdx = -1;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  size = canvas.clientWidth;
  canvas.width = canvas.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function draw() {
  const c = size / 2, r = c - 1;
  ctx.clearRect(0, 0, size, size);
  ctx.save();
  ctx.translate(c, c);
  ctx.rotate(rotation);
  const passing = spinning ? indexAtPointer() : -1;
  const fontPx = Math.max(10, Math.min(22, size / 36));
  ctx.font = `600 ${fontPx}px "Oswald", "Arial Narrow", sans-serif`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < N; i++) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, i * SLICE, (i + 1) * SLICE);
    ctx.closePath();
    const lit = i === landed || i === passing;
    ctx.fillStyle = lit ? C('--hit') : (i % 2 ? C('--slice-b') : C('--slice-a'));
    ctx.fill();
    ctx.strokeStyle = C('--rim');
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.save();
    ctx.rotate((i + 0.5) * SLICE);
    ctx.fillStyle = lit ? C('--bg') : C('--year');
    ctx.fillText(YEARS[i], r - 14, 0);
    ctx.restore();
  }
  ctx.restore();
}

// Slice under the pointer at the top (angle -90°)
function indexAtPointer() {
  const a = ((-Math.PI / 2 - rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
  return Math.floor(a / SLICE) % N;
}

function spin() {
  if (spinning) return;
  spinning = true; landed = -1;
  startSound();
  const start = rotation;
  // Every spin launches at the same speed and slows the same way; only how far it travels
  // (1.5 to 2.5 full turns) is random, so the landing spot is random but the feel is consistent.
  const turns = 1.5 + Math.random();
  const target = start + Math.PI * 2 * turns;
  const LAUNCH = 0.55; // turns per second at release
  const duration = reduce ? 600 : (2 * turns / LAUNCH) * 1000;
  const t0 = performance.now();
  const ease = t => 1 - Math.pow(1 - t, 2);
  function frame(now) {
    const t = Math.min(1, (now - t0) / duration);
    rotation = start + (target - start) * ease(t);
    const idx = indexAtPointer();
    if (idx !== lastIdx) { lastIdx = idx; tickSound(); if (!reduce) pointer.classList.add('tick'); requestAnimationFrame(() => pointer.classList.remove('tick')); }
    draw();
    if (t < 1) requestAnimationFrame(frame); else finish();
  }
  requestAnimationFrame(frame);
}

function finish() {
  rotation %= Math.PI * 2;
  landed = indexAtPointer();
  draw();
  big.textContent = YEARS[landed];
  haze.classList.add('show');
  revealSound();
  confetti();
  spinning = false;
}

// A small red, white and blue confetti burst; the canvas ignores clicks so nothing is blocked
const confCanvas = document.getElementById('confetti'), cctx = confCanvas.getContext('2d');
let confRun = 0;
function confetti() {
  if (reduce) return;
  const dpr = window.devicePixelRatio || 1, w = innerWidth, h = innerHeight;
  confCanvas.width = Math.round(w * dpr); confCanvas.height = Math.round(h * dpr);
  cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#d22f45', '#ffffff', '#3d6ad6'];
  const bits = Array.from({ length: 45 }, (_, i) => {
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.3;
    const sp = 6 + Math.random() * 7;
    return {
      x: w / 2 + (Math.random() - 0.5) * 60, y: h / 2,
      vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
      rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.3,
      sw: 6 + Math.random() * 5, sh: 3 + Math.random() * 3,
      c: colors[i % 3]
    };
  });
  const run = ++confRun, t0 = performance.now(), life = 2600;
  function step(now) {
    if (run !== confRun) return;
    const t = now - t0;
    cctx.clearRect(0, 0, w, h);
    if (t > life) return;
    cctx.globalAlpha = t > life - 700 ? (life - t) / 700 : 1;
    for (const b of bits) {
      b.vy += 0.22; b.vx *= 0.985; b.vy *= 0.985;
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      cctx.save();
      cctx.translate(b.x, b.y); cctx.rotate(b.rot);
      cctx.scale(1, Math.abs(Math.cos(b.rot * 2)) * 0.8 + 0.2);
      cctx.fillStyle = b.c;
      cctx.fillRect(-b.sw / 2, -b.sh / 2, b.sw, b.sh);
      cctx.restore();
    }
    cctx.globalAlpha = 1;
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function closeHaze() { haze.classList.remove('show'); }
haze.addEventListener('click', closeHaze);

canvas.addEventListener('click', spin);
document.addEventListener('keydown', e => { if (e.target === muteBtn) return; if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (haze.classList.contains('show')) closeHaze(); else spin(); } else if (e.key === 'Escape') closeHaze(); });
window.addEventListener('resize', resize);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
resize();
</script>

</body>
</html>
